<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="../../assets/css/register.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
      <h2>Đăng kí tài khoản</h2>
      <form action="">
        <label for="name">Họ và tên:</label>
        <input type="text" id="name" name="name" />
        <div class="error" id="name-error"></div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" />
        <div class="error" id="email-error"></div>
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" name="password" />
        <div class="error" id="password-error"></div>
        <label for="confirm-password">Xác nhận mật khẩu:</label>
        <input type="password" id="confirmPassword" name="confirm-password" />
        <div class="error" id="confirmPassword-error"></div>
      </form>
      <button id="btn">Đăng kí</button>
      <p>
        Đã có tài khoản? <a href="http://127.0.0.1:5500/pages/auth/login.html">Đăng nhập ngay</a>
      </p>
    </div>
<script src="../../assets/js/register.js"></script>
</body>

</html>
